  </defs>
  <!-- Halo brillante -->
  <circle cx="100" cy="100" r="85" fill="url(#glow)" />
  
  <!-- Cuerpo -->
  <ellipse cx="100" cy="100" rx="6" ry="17" fill="#333" />
  <circle cx="100" cy="84" r="8" fill="#333" />
  
  <!-- Antenas -->
  <line x1="97" y1="80" x2="90" y2="65" stroke="#333" stroke-width="2" />
  <line x1="103" y1="80" x2="110" y2="65" stroke="#333" stroke-width="2" />
  
  <!-- Alas izquierda -->
  <path d="M 100 95 C 60 90, 40 110, 60 130 C 70 145, 90 135, 100 105" fill="#FFA500" stroke="#FF8C00" stroke-width="2" opacity="0.9"/>
  <path d="M 100 95 C 70 85, 50 105, 70 125 C 80 135, 95 120, 100 105" fill="#FFD700" opacity="0.8"/>
  
  <!-- Alas derecha -->
  <path d="M 100 95 C 140 90, 160 110, 140 130 C 130 145, 110 135, 100 105" fill="#FFA500" stroke="#FF8C00" stroke-width="2" opacity="0.9"/>
  <path d="M 100 95 C 130 85, 150 105, 130 125 C 120 135, 105 120, 100 105" fill="#FFD700" opacity="0.8"/>
  
  <!-- Detalles de venas -->
  <path d="M 100 95 Q 70 100, 60 120" stroke="#FF8C00" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 100 95 Q 130 100, 140 120" stroke="#FF8C00" stroke-width="1" fill="none" opacity="0.6"/>
